  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#FF3D81" />

    <!-- ✏️ EDIT: base SEO. Page-level titles/descriptions are set in src/components/Seo.jsx -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      SPA fallback decoder — pairs with public/404.html so that refreshing a deep
      link (e.g. /portfolio/projects/bloom-botanics) does NOT 404 on GitHub Pages.
      Do not remove.
    -->
    <script>
      (function () {
        var l = window.location
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })()
    </script>

  <body>

    <noscript>

  </body>
