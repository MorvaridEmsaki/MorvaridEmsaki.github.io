<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      /* ---------------------------------------------------------------------
       * GitHub Pages SPA fallback (encoder half).
       * GitHub Pages serves this file for any URL it cannot find. We re-encode
       * the requested path into a query string and bounce to index.html, where
       * the decoder in index.html restores the real URL for React Router.
       *
       * ✏️ EDIT: pathSegmentsToKeep
       *    1  → project site at https://<user>.github.io/<repo>/   (default)
       *    0  → user site at    https://<user>.github.io/  or a custom domain
       * ------------------------------------------------------------------- */
      var pathSegmentsToKeep = 1

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
